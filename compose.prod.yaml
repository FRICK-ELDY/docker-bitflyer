# 本番用 Compose。開発用 compose.yaml（bind mount / mix phx.server）とは別物。
#
# ローカル検証（実弾なし）:
#   cp .env.example .env.prod   # SECRET_KEY_BASE / UI_BASIC_AUTH_* / POSTGRES_* を埋める
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# レジストリ配布後（digest 固定推奨）:
#   APP_IMAGE=ghcr.io/frick-eldy/docker-bitflyer@sha256:<digest>
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d
#
# TRADE_MODE の本番検証既定は dry_run。live は別判断（prod.md）。
# 秘密情報はホストの env_file のみ。イメージに焼かない。
# ホスト exporter は compose.observe.yaml（別ホストから scrape。同一ホストではホスト死を検知できない）。

name: docker-bitflyer-prod

services:
  db:
    image: postgres:16-alpine
    # DB はホストへ公開しない（アプリからの内部接続のみ）
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-docker_bitflyer_prod}
    volumes:
      # 永続化。バックアップ方針は architecture/env/prod.md
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    # digest 固定: APP_IMAGE=ghcr.io/.../docker-bitflyer@sha256:...
    # 未設定時はローカル build（検証用）。:latest だけに頼らない。
    image: ${APP_IMAGE:-docker-bitflyer:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    # ホスト公開は loopback のみ。コンテナ内は 0.0.0.0 で受け、外側 ACL と BasicAuth で守る。
    # 開発 Compose と同時検証するときは APP_HOST_PORT=127.0.0.1:4001 など。
    ports:
      - "${APP_HOST_PORT:-127.0.0.1:4000}:4000"
    # 子は直列停止するため、1 子 5s × 複数 + Repo 用に 45s（prep_stop で発注は即停止）
    stop_grace_period: 45s
    restart: unless-stopped
    environment:
      # .env.prod で明示する（例: ecto://postgres:SECRET@db:5432/docker_bitflyer_prod）
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      PHX_HOST: ${PHX_HOST:-localhost}
      # Docker ポートマップのためコンテナ内は全 IF。ホスト側 bind は上の 127.0.0.1:4000。
      PHX_HTTP_IP: ${PHX_HTTP_IP:-0.0.0.0}
      TRADE_MODE: ${TRADE_MODE:-dry_run}
      BITFLYER_LIVE_CONFIRM: ${BITFLYER_LIVE_CONFIRM:-}
      # BITFLYER_WS_URL は載せない。.env.prod に残ると live は起動停止。
      BITFLYER_API_KEY: ${BITFLYER_API_KEY:-}
      BITFLYER_API_SECRET: ${BITFLYER_API_SECRET:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      UI_BASIC_AUTH_USERNAME: ${UI_BASIC_AUTH_USERNAME:?UI_BASIC_AUTH_USERNAME is required}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:?UI_BASIC_AUTH_PASSWORD is required}
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docker_bitflyer_prod}
      PHX_SERVER: "true"
      PORT: "4000"
    env_file:
      - path: .env.prod
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  postgres_prod_data:
