# 開発用 Compose。サービス名とポートは architecture/env/dev.md に合わせる。
services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docker_bitflyer_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_bitflyer_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
    working_dir: /app
    entrypoint: ["sh", "/app/bin/docker-entrypoint.sh"]
    command: ["mix", "phx.server"]
    restart: unless-stopped
    # 子は直列停止するため、1 子 5s × 複数 + Repo 用に 45s（prep_stop で発注は即停止）
    stop_grace_period: 45s
    volumes:
      - .:/app
      - mix_deps:/app/deps
      - mix_build:/app/_build
    environment:
      DATABASE_URL: ${DATABASE_URL:-ecto://postgres:postgres@db:5432/docker_bitflyer_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change_me_generate_with_mix_phx_gen_secret}
      PHX_HOST: ${PHX_HOST:-localhost}
      TRADE_MODE: ${TRADE_MODE:-dry_run}
      BITFLYER_LIVE_CONFIRM: ${BITFLYER_LIVE_CONFIRM:-}
      # 空なら公式 Lightstream。Feed 断ドリルだけ。live で非空だと起動失敗。
      BITFLYER_WS_URL: ${BITFLYER_WS_URL:-}
      # MIX_ENV は注入しない。未設定時は Mix 既定の dev。
      # 固定すると preferred_envs（例: mix precommit → test）が効かなくなる。
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: docker_bitflyer_dev
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
  mix_deps:
  mix_build:
