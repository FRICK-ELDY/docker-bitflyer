# 承認済み成果物を GHCR へ push する（本番PC への自動実弾デプロイはしない）。
# 対象 SHA の最新 ci.yml が workflow 全体 success（precommit + docker-prod）であること。
# 未完了時は待たずに失敗し、完了後に CD を再実行する。方針: .workspace/0_doc/architecture/ci-cd.md
name: CD

on:
  # 明示タグのみ（main マージ alone では動かさない）
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (e.g. manual-20260909). Empty = git SHA."
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push prod image
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
      # GHCR は小文字必須
      IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require latest CI success for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          # 同一 SHA の「最新」ci.yml のみ見る（過去 success + 最新 failure を通さない）
          # 自動 wait はしない。未完了・失敗なら CD を落とす。
          latest="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --commit="${sha}" \
            --limit=1 \
            --json status,conclusion,databaseId,url)"
          if [ "$(echo "${latest}" | jq 'length')" -eq 0 ]; then
            echo "::error::No ci.yml run for ${sha}. Refusing GHCR push."
            echo "Push/merge to main (or open a PR) so CI runs, then re-run this workflow."
            exit 1
          fi
          status="$(echo "${latest}" | jq -r '.[0].status')"
          conclusion="$(echo "${latest}" | jq -r '.[0].conclusion // empty')"
          run_id="$(echo "${latest}" | jq -r '.[0].databaseId')"
          url="$(echo "${latest}" | jq -r '.[0].url')"
          if [ "${status}" != "completed" ]; then
            echo "::error::Latest CI for ${sha} is still ${status} (run ${run_id}). No auto-wait; re-run CD after it finishes. ${url}"
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Latest CI for ${sha} concluded ${conclusion} (run ${run_id}; whole workflow incl. precommit + docker-prod). Refusing GHCR push. ${url}"
            exit 1
          fi
          echo "Latest CI green for ${sha} (run ${run_id}). ${url}"

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Print digest for compose pin
        run: |
          echo "Pin compose with:"
          echo "APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
