# 品質ゲート: mix precommit（ローカルと同範囲）
# deps.audit は別ジョブ。advisory 検出時のみ fail。ツール/取得障害は落とさない。
# Actions はタグではなく commit SHA（Dependabot がコメントの版と一緒に更新）。
# 方針: .workspace/0_doc/architecture/ci-cd.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

# artifact は専用トークン。actions: write は他 run の cancel にも使えるので付けない。
permissions:
  contents: read

jobs:
  precommit:
    name: mix precommit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docker_bitflyer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docker_bitflyer_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      # 開発用 URL の形にしておくと、未設定時の *_test 寄せと揃う。実体は TEST_DATABASE_URL。
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/docker_bitflyer_dev
      TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/docker_bitflyer_ci
      TRADE_MODE: dry_run

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18.3"
          otp-version: "27"

      - name: Cache Mix deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Create and migrate test database
        run: mix ash.setup --domains Bitflyer.Trading

      - name: Quality gate
        run: mix precommit

  # Hex advisory 検出時だけ落とす。precommit とは分離（Hex 障害で format/test を止めない）。
  deps-audit:
    name: mix deps.audit
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18.3"
          otp-version: "27"

      - name: Cache Mix deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # advisory 取得は 1 回（json）に限定する。
      - name: Dependency audit
        run: |
          mkdir -p tmp
          set +e
          mix deps.audit --format=json > tmp/deps-audit.json 2> tmp/deps-audit.stderr
          json_exit=$?
          set -e
          if [ -s tmp/deps-audit.json ]; then
            cat tmp/deps-audit.json
          fi
          if [ -s tmp/deps-audit.stderr ]; then
            cat tmp/deps-audit.stderr >&2
          fi
          bash bin/classify-deps-audit.sh tmp/deps-audit.json "${json_exit}" tmp/deps-audit-meta.txt

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-audit-report
          path: |
            tmp/deps-audit.json
            tmp/deps-audit.stderr
            tmp/deps-audit-meta.txt
          if-no-files-found: warn
          retention-days: 30

  # Dockerfile.prod を push なしで検証（PR でも実行＝時間・Actions 分が増える意図的なトレードオフ）
  # CD ゲートは workflow 全体 success を見るため、本ジョブ失敗でも配布されない
  docker-prod:
    name: Build Dockerfile.prod (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build prod image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
